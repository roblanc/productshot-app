    <meta name="theme-color" content="#f5ede6" />
    <script>
      // Runs before the stylesheet paints. The app reads the same key and the
      // same rule; doing it here as well is what stops a dark flash on the way
      // to a light default.
      (function () {
        try {
          var saved = window.localStorage.getItem("productshot.theme");
          var theme = saved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#14110e" : "#eaf3f8");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <script>
      // Inline and first on purpose. The app installs its own error handler,
      // but that handler travels inside the bundle, so anything that stops the
      // bundle from loading or parsing leaves a blank page and nothing to read.
      // A phone cannot open a console, so the failure has to put itself on
      // screen. Capture phase catches resource errors (a 404 on the script)
      // as well as thrown ones.
      (function () {
        var shown = false;

        // The screen is for a bundle that never ran. Once React has put
        // something in #root the app is up, and whatever threw afterwards —
        // an extension, a content blocker, a rejected storage call — is not a
        // reason to replace a working editor with a black page.
        function started() {
          var root = document.getElementById("root");
          return !!(root && root.children.length);
        }

        function report(text) {
          if (shown || started()) return;
          shown = true;
          var root = document.getElementById("root") || document.body;
          root.setAttribute(
            "style",
            "padding:24px;font:13px/1.5 ui-monospace,Menlo,monospace;"
              + "color:#f6f5f4;background:#14110e;white-space:pre-wrap;word-break:break-word",
          );
          root.textContent = "Product Shot failed to start.\n\n" + text
            + "\n\nReload the page. If it says the same thing again, send this screen.";
        }

        // Two different failures put the same "could not load" on screen, and
        // they need opposite cures, so this escalates rather than guessing.
        //
        // One: the URL is right and the answer is wrong. /assets/* is served
        // immutable, and anything that once answered on that URL — a 404 from
        // a request that landed mid-deploy, a truncated response — is then held
        // for a year by the edge and by the browser, which will not even ask
        // again. Re-requesting the same file under a query string is a
        // different cache key everywhere, so it goes back to the origin.
        //
        // Two: the URL is wrong. A page held from a moment ago naming a file
        // the current deploy does not carry; no query string conjures that file
        // up, and what is stale is the HTML, so the page refetches itself.
        //
        // Both are tried, in that order, once each, before anyone is shown a
        // dead screen they can only read and shrug at.
        var BUST = "psretry";

        function retryAsset(node) {
          var url = node.src || node.href;
          if (!url || String(url).indexOf("/assets/") === -1) return false;
          // Already the second copy: this file is genuinely not being served.
          if (String(url).indexOf(BUST + "=") !== -1) return false;
          var separator = url.indexOf("?") === -1 ? "?" : "&";
          // An image heals in place. A second <img> in the head would fetch the
          // bytes and show nobody; the one already on the page has to be the
          // node that gets the second URL.
          if (node.tagName === "IMG") {
            node.src = url + separator + BUST + "=" + Date.now();
            return true;
          }
          var again;
          if (node.tagName === "SCRIPT") {
            again = document.createElement("script");
            again.type = node.type || "text/javascript";
          } else {
            again = document.createElement("link");
            again.rel = "stylesheet";
          }
          if (node.crossOrigin) again.crossOrigin = node.crossOrigin;
          again[node.tagName === "SCRIPT" ? "src" : "href"] =
            url + separator + BUST + "=" + Date.now();
          document.head.appendChild(again);
          return true;
        }

        var RETRY_KEY = "ps-asset-retry";
        function retriedAlready() {
          try {
            return window.sessionStorage.getItem(RETRY_KEY) === "1";
          } catch (error) {
            // Private mode can refuse storage. Without somewhere to remember
            // the attempt there is no safe way to reload, so report instead.
            return true;
          }
        }

        function refetch(url) {
          if (retriedAlready() || started()) return false;
          if (String(url).indexOf("/assets/") === -1) return false;
          try {
            window.sessionStorage.setItem(RETRY_KEY, "1");
          } catch (error) {
            return false;
          }
          var here = window.location.pathname + window.location.search;
          var separator = window.location.search ? "&" : "?";
          window.location.replace(here + separator + "reload=" + Date.now());
          return true;
        }

        window.addEventListener("load", function () {
          // The tab is only allowed one retry per stale page, not one forever.
          try {
            if (started()) window.sessionStorage.removeItem(RETRY_KEY);
          } catch (error) {
            /* nothing to clear */
          }
        });

        window.addEventListener(
          "error",
          function (event) {
            var node = event.target;
            if (node && node !== window && (node.src || node.href)) {
              if (retryAsset(node)) return;
              // A picture that will not come back is a gap in a page that
              // otherwise works. Reloading over it, or replacing it with a
              // failure screen, costs more than the missing image does.
              if (node.tagName === "IMG") return;
              if (refetch(node.src || node.href)) return;
              report("Could not load:\n" + (node.src || node.href));
              return;
            }
            // A cross-origin script reports no message, no file and no line.
            // Ours is same-origin, so this is somebody else's code in the page
            // and there is nothing here to tell the visitor.
            if (!event.filename && (!event.message || event.message === "Script error.")) {
              return;
            }
            report(
              (event.message || "Script error")
                + (event.filename ? "\n" + event.filename + ":" + event.lineno : ""),
            );
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          report("Unhandled promise rejection:\n" + (event.reason && event.reason.message
            ? event.reason.message
            : String(event.reason)));
        });
      })();
    </script>

<!-- The Mac app icon: the Mondrian mark on Apple's icon grid, an 824px body
     with 100px of air on a 1024px canvas, so it sits at the same size as the
     other apps in the Dock. Rendered to icon.png by `node build/render-icon.mjs`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185" /></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#FFFFFF" />
  </g>
  <g clip-path="url(#body)">
    <g transform="translate(100 100) scale(8.24)">
      <rect width="100" height="100" fill="#FFFFFF" />
      <rect x="36" y="0" width="64" height="64" fill="#FF3B30" />
      <rect x="0" y="72" width="28" height="28" fill="#007AFF" />
      <rect x="88" y="90" width="12" height="10" fill="#FFCC00" />
      <rect x="28" y="0" width="8" height="100" fill="#111111" />
      <rect x="80" y="64" width="8" height="36" fill="#111111" />
      <rect x="0" y="28" width="36" height="8" fill="#111111" />
      <rect x="0" y="64" width="100" height="8" fill="#111111" />
      <rect x="80" y="82" width="20" height="8" fill="#111111" />
    </g>
  </g>
</svg>
